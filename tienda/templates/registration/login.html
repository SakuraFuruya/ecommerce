<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | La Tienda X</title>

        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
    body { background-color: #f8f9fa; color: #212529; }
    .navbar { padding: 1rem 0; }
    .hero { min-height: 500px; display: flex; align-items: center; background: linear-gradient( 135deg, #212529, #343a40 ); color: white; }
    .hero h1 { font-size: 3.5rem; font-weight: 700; }
    .hero p { font-size: 1.2rem; color: #d6d6d6; max-width: 600px; }
    .btn-hero { padding: 0.8rem 2rem; font-weight: 600; border-radius: 50px; }
    .feature-card { border: none; background: white; border-radius: 15px; padding: 2rem; height: 100%; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
    .feature-icon { font-size: 2rem; margin-bottom: 1rem; } .section-title { font-weight: 700; }
    footer { margin-top: 5rem; padding: 2rem 0; background-color: #212529; color: #aaa; }
  </style>

</head>

<body>

  <div class="login-container mt-5">

      <div class="card mx-auto" style="max-width: 400px;">

          <div class="card-body p-5">

              <!-- Logo / nombre -->
              <div class="text-center mb-4">

                  <h2 class="fw-bold">
                      La Tienda X
                  </h2>

                  <p class="text-muted mb-0">
                      ¡Bienvenido!
                  </p>

              </div>


              <!-- Login -->
              <form method="POST">

                  {% csrf_token %}

                  <div class="mb-3">

                      <label for="username" class="form-label">
                          Usuario
                      </label>

                      <input
                          type="text"
                          class="form-control"
                          id="username"
                          name="username"
                          placeholder="Ingresa tu usuario"
                          required
                      >
                  </div>


                  <div class="mb-4">

                      <label for="password" class="form-label">
                          Contraseña
                      </label>

                      <input
                          type="password"
                          class="form-control"
                          id="password"
                          name="password"
                          placeholder="Ingresa tu contraseña"
                          required
                      >

                  </div>


                  {% if messages %}
                      {% for message in messages %}

                          <div class="alert alert-danger">
                              {{ message }}
                          </div>

                      {% endfor %}
                  {% endif %}


                  <button
                      type="submit"
                      class="btn btn-dark w-100 btn-login"
                  >
                      Iniciar sesión
                  </button>

              </form>


              <!-- Registro -->
              <div class="text-center mt-4">
                  <p class="text-muted mb-2">
                      ¿No tienes una cuenta?
                  </p>
              </div>


              <!-- Volver -->
              <div class="text-center mt-4">

                  <a
                      href="{% url 'inicio' %}"
                      class="back-link"
                  >
                      ← Volver al inicio
                  </a>

              </div>

          </div>

      </div>

    </div>

</body>
</html>
```
