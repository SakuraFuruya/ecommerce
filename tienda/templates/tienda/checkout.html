{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'inicio' %}">La Tienda X</a>
    <a class="btn btn-outline-light" href="{% url 'ver_carrito' %}">Carrito</a>
  </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Finalizar compra</h1>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="row">
        <div class="col-md-7">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="direccion" class="form-label">Dirección de entrega</label>
                    <textarea id="direccion" name="direccion" class="form-control" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-success btn-lg">Confirmar pedido</button>
            </form>
        </div>

        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4>Resumen</h4>
                    {% for item in carrito_items %}
                        <div class="d-flex justify-content-between">
                            <span>{{ item.producto.nombre }} x {{ item.cantidad }}</span>
                            <span>${{ item.subtotal }}</span>
                        </div>
                    {% empty %}
                        <p>Sin productos.</p>
                    {% endfor %}
                    <hr>
                    <div class="d-flex justify-content-between fw-bold">
                        <span>Total</span>
                        <span>${{ total }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
